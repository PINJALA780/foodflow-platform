services:

  postgres:
    image: postgres:16
    container_name: foodflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: foodflow_users,foodflow_restaurants,foodflow_menu,foodflow_orders,foodflow_payments,foodflow_notifications
    ports:
      - "5433:5432"
    volumes:
      - foodflow-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - foodflow-network

  user-service:
    build:
      context: ./backend/user-service
    container_name: foodflow-user-service
    ports:
      - "8091:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: foodflow_users
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8081
    depends_on:
      - postgres
    networks:
      - foodflow-network

  restaurant-service:
    build:
      context: ./backend/restaurant-service
    container_name: foodflow-restaurant-service
    ports:
      - "8092:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: foodflow_restaurants
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8082
    depends_on:
      - postgres
    networks:
      - foodflow-network

  menu-service:
    build:
      context: ./backend/menu-service
    container_name: foodflow-menu-service
    ports:
      - "8093:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: foodflow_menu
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8083
    depends_on:
      - postgres
    networks:
      - foodflow-network

  order-service:
    build:
      context: ./backend/order-service
    container_name: foodflow-order-service
    ports:
      - "8094:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: foodflow_orders
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8084
      MENU_SERVICE_URL: http://menu-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    depends_on:
      - postgres
      - menu-service
      - payment-service
      - notification-service
    networks:
      - foodflow-network

  payment-service:
    build:
      context: ./backend/payment-service
    container_name: foodflow-payment-service
    ports:
      - "8095:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: foodflow_payments
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8085
    depends_on:
      - postgres
    networks:
      - foodflow-network

  notification-service:
    build:
      context: ./backend/notification-service
    container_name: foodflow-notification-service
    ports:
      - "8096:8086"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: foodflow_notifications
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8086
    depends_on:
      - postgres
    networks:
      - foodflow-network

networks:
  foodflow-network:
    name: foodflow-network

volumes:
  foodflow-postgres-data:
    name: foodflow-postgres-data
