name: FoodFlow CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  # ============================================================
  # FRONTEND CI
  # ============================================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  # ============================================================
  # BACKEND CI
  # ============================================================
  backend:
    name: Backend Build and Quality
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - restaurant-service
          - menu-service
          - order-service
          - payment-service
          - notification-service

    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Java
      # --------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # --------------------------------------------------------
      # Build + Unit Tests + JaCoCo
      # --------------------------------------------------------
      - name: Build and test
        run: mvn -B clean verify


      # --------------------------------------------------------
      # SonarQube
      # Fully qualified plugin coordinates avoid the
      # "No plugin found for prefix 'sonar'" error.
      # --------------------------------------------------------
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true


      # --------------------------------------------------------
      # JaCoCo Report
      # --------------------------------------------------------
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/site/jacoco/
          if-no-files-found: warn
