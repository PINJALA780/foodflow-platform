spring:
  application:
    name: order-service

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodflow_orders}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      pool-name: OrderServiceHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: '@project.version@'
    description: FoodFlow Order Service

application:
  jwt:
    secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForFoodFlowJwtAuthenticationThatMustBeAtLeast256Bits}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  services:
    menu-service-url: ${MENU_SERVICE_URL:http://localhost:8083}
    payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8085}
    notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
